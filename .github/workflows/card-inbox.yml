name: Card inbox (single entrypoint)
on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing CARD issue number to retry'
        required: true
        type: number
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: card-single-ingress
  cancel-in-progress: false

jobs:
  ingest:
    # Dispatched issues are re-validated below (owner, title, state).
    if: >-
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.title, 'CARD:') &&
       github.event.issue.user.login == github.repository_owner) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-content
          fetch-depth: 0
      - name: Guard against routing regressions
        run: python3 scripts/test_card_inbox.py
      - name: Parse and authorize one existing CARD request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          RETRY_NUMBER: ${{ inputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              number = os.environ['RETRY_NUMBER']
              if not number.isdigit() or int(number) < 1:
                  raise SystemExit('Valid CARD issue number required')
              issue = json.loads(subprocess.check_output(
                  ['gh', 'api', f"repos/{os.environ['GH_REPO']}/issues/{number}"]))
          else:
              event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
              issue = event['issue']
          if (issue.get('user', {}).get('login') != os.environ['REPO_OWNER']
                  or not issue.get('title', '').startswith('CARD:')
                  or issue.get('state') != 'open'
                  or 'pull_request' in issue):
              raise SystemExit('Only an open CARD issue authored by repo owner can publish')
          request = json.loads(issue.get('body') or '')
          if not isinstance(request, dict):
              raise SystemExit('CARD issue body must be a single JSON object')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'card-request.json').write_text(
              json.dumps(request, ensure_ascii=False), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print('issue_number=' + str(issue['number']), file=out)
          PY
      - name: Publish with SHA-safe retries and remote readback
        id: publish
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            # A separate Android sync may have pushed a new live-content
            # revision. Always recompute the payload against that revision.
            git fetch origin live-content
            git reset --hard origin/live-content
            if ! result="$(python3 scripts/card_inbox.py add \
              --paths-out "$RUNNER_TEMP/card-paths.txt" < "$RUNNER_TEMP/card-request.json" \
              2> "$RUNNER_TEMP/card-inbox-error.txt")"; then
              if grep -q 'ARCHIVE_NOT_READY' "$RUNNER_TEMP/card-inbox-error.txt"; then
                echo "pending=true" >> "$GITHUB_OUTPUT"
                echo "CARD request is queued until Android uploads full vocabulary."
                exit 0
              fi
              cat "$RUNNER_TEMP/card-inbox-error.txt" >&2
              exit 1
            fi
            python3 scripts/card_inbox.py check
            while IFS= read -r dest; do
              if [ -n "$dest" ]; then
                case "$dest" in
                  content/papa/cards-es.json|content/papa/cards-en.json|\
                  content/mama/cards-es.json|content/mama/cards-en.json|\
                  content/dima/cards-es.json|content/dima/cards-en.json)
                    git add -- "$dest" ;;
                  *) echo "Unsafe destination: $dest" >&2; exit 1 ;;
                esac
              fi
            done < "$RUNNER_TEMP/card-paths.txt"
            if ! git diff --cached --quiet; then
              git config user.name "card-inbox[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Card inbox: publish issue #$ISSUE_NUMBER"
              if ! git push origin HEAD:refs/heads/live-content; then
                echo "Concurrent update or write denied; retrying against latest archive" >&2
                sleep "$attempt"
                continue
              fi
            fi
            # Re-fetch the remote publication. Local files alone are not proof.
            git fetch origin live-content
            git reset --hard origin/live-content
            verified="$(python3 scripts/card_inbox.py verify < "$RUNNER_TEMP/card-request.json")"
            printf '%s\n%s\n' "$result" "$verified"
            echo "result=$result" >> "$GITHUB_OUTPUT"
            echo "verified=$verified" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "Card inbox failed after five concurrent update retries" >&2
          exit 1
      - name: Confirm actual publication and close request
        if: ${{ success() && steps.publish.outputs.pending != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
          RESULT: ${{ steps.publish.outputs.result }}
          VERIFIED: ${{ steps.publish.outputs.verified }}
          REVISION: ${{ steps.publish.outputs.commit }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" \
            --body "Card inbox accepted: $RESULT; $VERIFIED; revision=$REVISION. Canonical destination: live-content/content/<profile>/cards-<language>.json. Phone import is separate."
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO"
      - name: Report waiting for first Android archive export
        if: ${{ steps.publish.outputs.pending == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" \
            --body "Card inbox pending: Android's full vocabulary archive is not yet synchronized. No cards were published. This request will retry automatically when the archive becomes available. Do not create a duplicate Issue."
      - name: Report rejection without publishing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
        run: |
          cat "$RUNNER_TEMP/card-inbox-error.txt" 2>/dev/null || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" \
            --body "Card inbox rejected: not confirmed as published. See validation details in the workflow run. Correct the same Issue and retry."

  retry_waiting:
    # A blank Android archive is a legitimate initial state, not a bad card request.
    # Retry queued issues only after the phone has exported relevant vocabulary.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-content
      - name: Dispatch ready owner-authored CARD requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue list --repo "$GH_REPO" --state open --limit 500 \
            --json number,title,body,author > "$RUNNER_TEMP/card-open.json"
          python3 - <<'PY' > "$RUNNER_TEMP/card-ready-numbers.txt"
          import json, os, pathlib
          issues = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'card-open.json').read_text())
          root = pathlib.Path.cwd()
          for issue in issues:
              if issue.get('author', {}).get('login') != os.environ['REPO_OWNER']:
                  continue
              if not issue.get('title', '').startswith('CARD:'):
                  continue
              try:
                  body = json.loads(issue.get('body') or '')
                  profiles = body.get('profiles', body.get('profile'))
                  profiles = [profiles] if isinstance(profiles, str) else profiles
                  language = body.get('language')
                  if (not isinstance(profiles, list) or not profiles or
                      any(p not in ('papa', 'mama', 'dima') for p in profiles) or
                      language not in ('es', 'en')):
                      continue
                  if all(len(json.loads(
                      (root/'content'/p/f'vocabulary-{language}.json').read_text()
                  )['items']) > 0 for p in profiles):
                      print(issue['number'])
              except (OSError, KeyError, ValueError, TypeError):
                  continue
          PY
          while IFS= read -r number; do
            [ -n "$number" ] || continue
            gh workflow run card-inbox.yml --repo "$GH_REPO" --ref main \
              -f issue_number="$number"
          done < "$RUNNER_TEMP/card-ready-numbers.txt"
