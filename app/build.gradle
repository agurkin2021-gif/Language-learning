plugins { id 'com.android.application' }
def buildNumberText = providers.gradleProperty('buildNumber').orElse('0').get()
if (!(buildNumberText ==~ /[0-9]{1,8}/)) throw new GradleException('buildNumber must be 0..99999999')
def buildNumber = buildNumberText.toInteger()
def revision = providers.gradleProperty('sourceRevision').orElse('local').get()
if (!(revision ==~ /local|[a-f0-9]{7,40}/)) throw new GradleException('sourceRevision must be a Git SHA or local')
def runId = providers.gradleProperty('buildRunId').orElse('').get()
if (!(runId ==~ /[0-9]{0,20}/)) throw new GradleException('buildRunId must be numeric')
android {
    buildFeatures { buildConfig true }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    namespace 'ru.spanish.learning'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'ru.spanish.learning'
        minSdk 26
        targetSdk 35
        versionCode 100 + buildNumber
        versionName buildNumber == 0 ? '0.1-local' : "0.1.${buildNumber}-test"
        buildConfigField 'String', 'SOURCE_REVISION', "\"${revision}\""
        buildConfigField 'String', 'BUILD_RUN_ID', "\"${runId}\""
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    buildTypes {
        // Keep x86/x86_64 in debug for emulator tests. The release APK
        // retains both Android ARM architectures while omitting x86 runtime binaries.
        release {
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    // Verified build input downloaded from the upstream sherpa-onnx release by CI.
    implementation files('libs/sherpa-onnx.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    testImplementation 'junit:junit:4.13.2'
}
