# HTTPS by default. Requires a real DNS hostname pointing at this VPS.
# See bridge/README.md. No values of any secrets are stored in git.
services:
  broker:
    build: .
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set the separate OpenAI API key in .env}
      STUDY_BROKER_TOKEN: ${STUDY_BROKER_TOKEN:?Set a long secret in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      STUDY_BROKER_BIND: "0.0.0.0"
      STUDY_BROKER_PORT: "8765"
    expose:
      - "8765"
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 80
    mem_limit: 256m
  https:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - broker
    environment:
      STUDY_DOMAIN: ${STUDY_DOMAIN:?Set a DNS hostname for HTTPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
